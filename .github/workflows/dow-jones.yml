name: Dow Jones Data Update

on:
  workflow_dispatch:

jobs:
  update-dow-jones:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Dow Jones live data
        env:
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
        run: |
          node scripts/fetchDowJones.js live

      - name: Check changes
        run: |
          git status --short

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/market/dow_jones.json

          if git diff --cached --quiet; then
            echo "No DJI data changes to commit."
            exit 0
          fi

          git commit -m "Update Dow Jones live data"

          git pull --rebase origin main

          git push origin main
