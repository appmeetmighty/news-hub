name: Breaking News Notification

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Update News Hub"
    types:
      - completed

permissions:
  contents: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Hero
        id: hero
        run: |
          HERO_ID=$(jq -r '.articles.hero.id' output/home.json)
          HERO_TITLE=$(jq -r '.articles.hero.title' output/home.json)
          HERO_PATH=$(jq -r '.articles.hero.path' output/home.json)
          HERO_IMAGE=$(jq -r '.articles.hero.image' output/home.json)

          echo "hero_id=$HERO_ID" >> $GITHUB_OUTPUT
          echo "hero_title=$HERO_TITLE" >> $GITHUB_OUTPUT
          echo "hero_path=$HERO_PATH" >> $GITHUB_OUTPUT
          echo "hero_image=$HERO_IMAGE" >> $GITHUB_OUTPUT

      - name: Read Previous Hero
        id: previous
        run: |
          if [ -f ".github/hero_id.txt" ]; then
            PREVIOUS_ID=$(cat .github/hero_id.txt)
          else
            PREVIOUS_ID=""
          fi

          echo "previous_id=$PREVIOUS_ID" >> $GITHUB_OUTPUT

      - name: Stop if Hero is unchanged
        if: steps.hero.outputs.hero_id == steps.previous.outputs.previous_id
        run: |
          echo "Hero article unchanged."
          exit 0

      - name: Send OneSignal Notification
        run: |
          jq -n \
            --arg app_id "${{ secrets.ONESIGNAL_APP_ID }}" \
            --arg title "📰 Breaking News" \
            --arg body "${{ steps.hero.outputs.hero_title }}" \
            --arg image "${{ steps.hero.outputs.hero_image }}" \
            --arg path "${{ steps.hero.outputs.hero_path }}" \
            '{
              app_id: $app_id,
              included_segments: ["All"],
              headings: {
                en: $title
              },
              contents: {
                en: $body
              },
              big_picture: $image,
              chrome_web_image: $image,
              large_icon: $image,
              data: {
                articlePath: $path
              }
            }' > payload.json

          echo "Payload:"
          cat payload.json

          curl \
            -X POST https://api.onesignal.com/notifications \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json

      - name: Save New Hero ID
        run: |
          echo "${{ steps.hero.outputs.hero_id }}" > .github/hero_id.txt

      - name: Commit Updated Hero ID
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .github/hero_id.txt

          git diff --cached --quiet || git commit -m "Update hero id"

          git push
